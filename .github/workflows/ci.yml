name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # The shaders only compile at runtime, so a green build proves nothing
      # about the water. Boot the built game in headless Chromium and fail on
      # any WebGL or console error.
      - name: Smoke test
        run: |
          npx playwright install --with-deps chromium
          npx vite preview --port 4173 &
          npx wait-on http://localhost:4173/${{ github.event.repository.name }}/ -t 60000
          node tools/smoke.mjs http://localhost:4173/${{ github.event.repository.name }}/ smoke.png 4000
        env:
          PLAYWRIGHT_BROWSERS_PATH: '0'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-screenshot
          path: smoke.png
          if-no-files-found: ignore
