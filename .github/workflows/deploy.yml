name: Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time; a queued run supersedes the one waiting, never the one
# already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

# Only what publishing the branch needs. Note this deliberately does NOT use
# the Pages-as-Actions-source flow: GITHUB_TOKEN can deploy to a Pages site but
# cannot create one, so that path needs somebody to visit Settings first. §3
# specifies a gh-pages branch, and a branch is something the token can write.
permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The gates, in the order that fails fastest. A red build must not reach
      # Pages: this game has no server to roll anything back from.
      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          # GitHub Pages serves a project site from /<repo>/.
          BASE_PATH: /${{ github.event.repository.name }}/
          BUILD_ID: ${{ github.sha }}

      # Published with plain git rather than a third-party action: it is four
      # commands, it is auditable, and a deploy step is not somewhere to take
      # on a dependency.
      - name: Publish to gh-pages
        working-directory: dist
        run: |
          # Jekyll is not wanted anywhere near a built bundle.
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA}"
          git push -q --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
