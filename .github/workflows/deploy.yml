name: Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time; a queued run supersedes the one waiting, never the one
# already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The gates, in the order that fails fastest. A red build must not reach
      # Pages: this game has no server to roll anything back from.
      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          # GitHub Pages serves a project site from /<repo>/.
          BASE_PATH: /${{ github.event.repository.name }}/
          BUILD_ID: ${{ github.sha }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
